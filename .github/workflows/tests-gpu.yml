# GPU test workflow. Runs on a self-hosted runner with a CUDA GPU.
#
# IMPORTANT: this requires a self-hosted runner with the `cuda` and
# `gpu` labels. GitHub-hosted runners do not have GPUs (and CUDA-enabled
# Linux runners cost). Enable this workflow only once you have a runner.
# See https://docs.github.com/en/actions/hosting-your-own-runners for
# setup. The runner must have:
#   - NVIDIA driver + CUDA toolkit 12.x
#   - Python 3.10+
#   - A compute-capability >= 8.0 GPU (Ampere, Ada, Hopper, Blackwell)
#
# The GPU job is gated on the repository variable GPU_RUNNER_AVAILABLE rather
# than a hard `if: false`: set it to "true" in Settings > Secrets and variables
# > Actions > Variables once a self-hosted runner is online, and the job runs on
# every push/PR with no code change. Leaving it unset skips the job cleanly
# (no stuck "pending" runs waiting on a runner that doesn't exist).
#
# The cpu-checks job below DOES run on GitHub-hosted runners every push: it
# exercises the pure-PyTorch reference + config validation, so there is real
# automated CI even before a GPU runner is attached.

name: tests-gpu

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  cpu-checks:
    # Always runs on GitHub-hosted runners: validates the pure-Python surface
    # (reference attention + NystromConfig) that does not need a GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch + pytest
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" pytest
      - name: Reference forward/backward + config smoke test
        run: |
          python - <<'PY'
          import torch
          from flash_nystrom.reference import nystrom_attention_reference
          from flash_nystrom.nystrom_config import NystromConfig
          # config validation: bad kappa_star must raise
          NystromConfig(kappa_star=5.0)
          for bad in (-1.0, float("inf"), float("nan")):
              try:
                  NystromConfig(kappa_star=bad); raise SystemExit(f"FAIL: kappa_star={bad} accepted")
              except AssertionError:
                  pass
          # reference forward+backward runs on CPU and produces finite grads
          q = torch.randn(1, 2, 256, 64, requires_grad=True)
          k = torch.randn(1, 2, 256, 64, requires_grad=True)
          v = torch.randn(1, 2, 256, 64, requires_grad=True)
          out = nystrom_attention_reference(q, k, v, 64, 6, kappa_star=5.0)
          out.sum().backward()
          assert all(t.grad is not None and torch.isfinite(t.grad).all() for t in (q, k, v))
          print("cpu-checks OK")
          PY

  tests:
    # See header: set repo variable GPU_RUNNER_AVAILABLE=true once a runner is up.
    if: ${{ vars.GPU_RUNNER_AVAILABLE == 'true' }}
    runs-on: [self-hosted, linux, cuda, gpu]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        torch: ["2.4", "2.5"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyTorch ${{ matrix.torch }} (CUDA 12.x)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cu124 \
              "torch~=${{ matrix.torch }}.0"

      - name: Install build deps + pytest
        run: |
          pip install pytest ninja

      - name: Build flash-nystrom extension
        run: |
          # Build defaults to quiet (no ptxas -v). Set FLASH_NYSTROM_VERBOSE=1
          # if you want resource-usage output for kernel tuning.
          pip install -e . --no-build-isolation -v

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Print kernel resource report
        run: |
          # Smoke test the diagnostic tool too.
          python tools/kernel_report.py || true
