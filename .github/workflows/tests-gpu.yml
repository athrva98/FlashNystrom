# GPU test workflow. Runs on a self-hosted runner with a CUDA GPU.
#
# IMPORTANT: this requires a self-hosted runner with the `cuda` and
# `gpu` labels. GitHub-hosted runners do not have GPUs (and CUDA-enabled
# Linux runners cost). Enable this workflow only once you have a runner.
# See https://docs.github.com/en/actions/hosting-your-own-runners for
# setup. The runner must have:
#   - NVIDIA driver + CUDA toolkit 12.x
#   - Python 3.10+
#   - A compute-capability >= 8.0 GPU (Ampere, Ada, Hopper, Blackwell)
#
# Until a runner is attached, the workflow stays disabled by the `if`
# guard below. Remove the guard and uncomment the `runs-on` line once
# the runner is online.

name: tests-gpu

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    # Disabled until a self-hosted GPU runner is attached.
    if: false
    runs-on: [self-hosted, linux, cuda, gpu]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        torch: ["2.4", "2.5"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyTorch ${{ matrix.torch }} (CUDA 12.x)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cu124 \
              "torch~=${{ matrix.torch }}.0"

      - name: Install build deps + pytest
        run: |
          pip install pytest ninja

      - name: Build flash-nystrom extension
        run: |
          # Build defaults to quiet (no ptxas -v). Set FLASH_NYSTROM_VERBOSE=1
          # if you want resource-usage output for kernel tuning.
          pip install -e . --no-build-isolation -v

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Print kernel resource report
        run: |
          # Smoke test the diagnostic tool too.
          python tools/kernel_report.py || true
